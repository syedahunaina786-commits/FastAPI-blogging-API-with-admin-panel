<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - DevBlog</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">DevBlog Admin</a>
    <div>
      <a href="/">Public Blog</a>
      <a href="/docs" target="_blank">API Docs</a>
    </div>
  </nav>

  <div class="container">
    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <div class="grid-2">
      <div class="card">
        <h2>Admin Sign In</h2>
        <form method="post" action="/admin/login">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="admin@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn">Login to Dashboard</button>
        </form>
      </div>

      <div class="card">
        <h2>Create Admin Account</h2>
        <form method="post" action="/admin/register">
          <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Syeda Hunaina">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="admin@example.com">
          </div>
          <div class="form-group">
            <label>Password (min 6 chars)</label>
            <input type="password" name="password" minlength="6" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-secondary">Register & Enter</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
